name: CI/CD — Build, Test, Coverage & Azure Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build-and-test:
    name: .NET 10 Build, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore PatientManagement.slnx

      - name: Build solution
        run: dotnet build PatientManagement.slnx --no-restore --configuration Release

      - name: Run unit, integration & 28-case AI evaluation suite with coverage
        run: dotnet test PatientManagement.slnx --no-build --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults --verbosity normal

      - name: Upload .NET code coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Publish API artifact
        run: dotnet publish src/PatientManagement.Api/PatientManagement.Api.csproj --no-restore --configuration Release --output ./publish

      - name: Generate idempotent SQL migration script (separate deployment step)
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool install --global dotnet-ef --version 10.* || dotnet tool update --global dotnet-ef --version 10.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          "$HOME/.dotnet/tools/dotnet-ef" migrations script --idempotent --project src/PatientManagement.Infrastructure --startup-project src/PatientManagement.Api --output ./publish/migrations.sql

      - name: Upload API & SQL migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: api-publish-artifact
          path: ./publish

  frontend-build-and-test:
    name: Angular 19 Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm packages
        run: npm ci

      - name: TypeScript type-check & lint
        run: npm run lint

      - name: Run Angular unit tests (ChromeHeadless)
        run: npm test

      - name: Build production Angular bundle
        run: npm run build

      - name: Upload Angular dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy-azure:
    name: Deploy to Azure App Service
    needs: [backend-build-and-test, frontend-build-and-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish-artifact
          path: ./publish

      - name: Apply idempotent SQL migrations to Azure SQL Database
        uses: azure/sql-action@v2.3
        with:
          connection-string: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          path: ./publish/migrations.sql

      - name: Remove migration script from web deployment package
        run: rm -f ./publish/migrations.sql

      - name: Deploy API to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
