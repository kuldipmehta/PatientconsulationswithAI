<div class="app-shell">
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="top-nav">
    <div class="nav-inner container">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">CS</span>
        <div>
          <span class="brand-name">CareSync</span>
          <span class="brand-tag">Clinical AI Workspace</span>
        </div>
        <span class="health-dot" [class.healthy]="apiHealthy()" [title]="apiHealthy() ? 'Backend API Healthy' : 'Backend API Unreachable'">
          {{ apiHealthy() ? 'API Online' : 'API Offline' }}
        </span>
      </div>

      <nav class="main-links" aria-label="Primary navigation" *ngIf="auth.isAuthenticated()">
        <a routerLink="/patients" routerLinkActive="active" class="nav-link">Patients</a>
        <a routerLink="/consultations" routerLinkActive="active" class="nav-link">Consultations</a>
        <a *ngIf="auth.canUseAi()" routerLink="/ai-agent" routerLinkActive="active" class="nav-link">AI Assistant</a>
        <a *ngIf="auth.canViewEmails()" routerLink="/emails" routerLinkActive="active" class="nav-link">Email Logs</a>
        <a *ngIf="auth.isAdmin()" routerLink="/audit" routerLinkActive="active" class="nav-link">Audit Trail</a>
      </nav>

      <div class="user-controls" *ngIf="auth.currentUser() as user">
        <span class="user-name">{{ user.fullName }}</span>
        <span class="badge badge-primary">{{ user.role }}</span>
        <button type="button" class="btn btn-secondary btn-sm" (click)="auth.logout()">Sign Out</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container main-body">
    <router-outlet></router-outlet>
  </main>
</div>
